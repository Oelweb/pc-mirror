[workspace]
resolver = "2"
members = ["crates/pcmirror", "crates/pcmirror-sign"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
